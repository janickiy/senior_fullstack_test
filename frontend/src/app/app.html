<a class="skip-link" [href]="skipHref()">Перейти к заказам</a>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/" aria-label="Главная — заказы магазина">
      <span class="brand-icon" aria-hidden="true"
        ><svg viewBox="0 0 24 24">
          <path d="m4 7 8-4 8 4-8 4-8-4Z M4 7v10l8 4 8-4V7 M12 11v10 M8 5l8 4" /></svg
      ></span>
      <span>Магазин<span class="brand-dot">.</span></span>
    </a>
    <span class="topbar-section">Заказы маркетплейса</span>
  </div>
</header>

<main class="workspace">
  <div class="page-heading">
    <h1>Заказы</h1>
    <div class="page-actions">
      <button
        class="button button-primary import-button"
        type="button"
        (click)="store.importOrders()"
        [disabled]="store.isImporting()"
      >
        @if (store.isImporting()) {
          <span class="spinner" aria-hidden="true"></span>Загружаем…
        } @else {
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 3v12 M7 10l5 5 5-5 M5 15v5h14v-5" /></svg
          >Загрузить заказы
        }
      </button>
    </div>
  </div>

  <div class="sr-only" role="status" aria-live="polite">
    {{ store.isImporting() ? 'Идёт загрузка заказов.' : store.notice() }}
  </div>

  @if (store.importError(); as error) {
    <div class="alert alert-error import-error" role="alert">
      <div>
        <strong>Загрузка не завершена</strong>
        <p>{{ error }}</p>
      </div>
      <button
        class="button button-outline"
        type="button"
        (click)="store.importOrders()"
        [disabled]="store.isImporting()"
      >
        Повторить загрузку
      </button>
    </div>
  }

  @if (store.importReport(); as report) {
    <app-import-report [report]="report" [shopId]="store.shopId()" />
  }

  <app-orders-table />
</main>
